apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ./custom-resources/backend/pvc.yml
  - ./custom-resources/backend/configmap.yml
  - ./custom-resources/backend/sealed-secret.yml
  - ./custom-resources/backend/deployment.yml
  - ./custom-resources/backend/service.yml
  - ./custom-resources/frontend/configmap.yml
  - ./custom-resources/frontend/deployment.yml
  - ./custom-resources/frontend/service.yml
  - ./custom-resources/httproute/frontend.yml
images:
  - name: ghcr.io/nile-quran-community/nile-quran-nextjs
    newTag: 2.0.1
  - name: ghcr.io/nile-quran-community/nile-quran-django
    newTag: 1.0.0
