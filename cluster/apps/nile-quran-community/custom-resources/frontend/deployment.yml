apiVersion: apps/v1
kind: Deployment
metadata:
  name: nqc-frontend
  labels:
    app: nqc-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nqc-frontend
  template:
    metadata:
      labels:
        app: nqc-frontend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: nqc-frontend
          image: ghcr.io/nile-quran-community/nile-quran-nextjs:latest
          envFrom:
            - configMapRef:
                name: nqc-frontend
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            timeoutSeconds: 5
            tcpSocket:
              port: 3000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
