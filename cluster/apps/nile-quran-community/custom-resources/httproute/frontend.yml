apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nqc-frontend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: traefik
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: nqc-frontend
          port: 80
          weight: 1
