apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        enabled: true
    gateway:
      enabled: false
    ports:
      web:
        port: 80
      websecure:
        port: 443
    ingressRoute:
      dashboard:
        enabled: true
