apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  sources:
    - chart: traefik
      repoURL: https://traefik.github.io/charts
      targetRevision: 39.0.0
      helm:
        releaseName: traefik
        valueFiles:
          - $values/helm-values.yml
    - repoURL: https://github.com/nu-quran-community/infra.git
      targetRevision: HEAD
      path: cluster/manifests/admin/traefik
      ref: values
