[settings]
lockfile = true
all_compile = false

[tools]
# NOTE: IaC
opentofu = "1.12"
ansible-core = { version = "2.21", uvx_args = "-p 3.13 --with ansible==14" }
# NOTE: K8s
kubectl = "1.36"
helm = "4.2"
argocd = "3.4.5"
kubeseal = "0.38.4"
# NOTE: Linters
tflint = "0.64"
# NOTE: Utils
prek = "0.4"

[env]
ANSIBLE_COLLECTIONS_PATH = { value = "{{ config_root }}/ansible/collections:{{ tools['ansible-core'].path }}/ansible-core/lib/python3.13/site-packages", tools = true }

[tasks.install]
description = "Install all development environment dependencies and hooks"
alias = "i"
run = ["mise install", "prek install"]

[tasks.seal]
description = "Create / edit a Kubernetes sealed secret manifest"
usage = '''
flag "-n --namespace <name>" help="Namespace scope for creating the sealed secret" default="default" required=#true
flag "-f --file <path>" help="File path for the existing secret to seal" required=#true
flag "-w --write <output>" help="Output file path"
'''
run = '''
kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets -o yaml -n "{{ usage.namespace }}" -f "{{ usage.file }}"{% if usage.write %} -w "{{ usage.write }}"{% endif %}
'''
